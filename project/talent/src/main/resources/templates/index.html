<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>재능거래 플랫폼</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .service-card { margin-bottom: 20px; }
        .service-img { height: 200px; object-fit: cover; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">재능거래 플랫폼</a>
        <a class="btn btn-primary" href="/register">재능 등록하기</a>
    </div>
</nav>

<div class="container">
    <h2 class="mb-4">최신 재능 목록</h2>
    <div class="row">
        <div class="col-md-4 service-card" th:each="service : ${services}">
            <div class="card h-100">
                <img th:src="${service.imageUrl != null ? service.imageUrl : 'https://via.placeholder.com/300x200'}" class="card-img-top service-img" alt="재능 이미지">
                <div class="card-body">
                    <h5 class="card-title" th:text="${service.title}">제목</h5>
                    <p class="card-text text-muted" th:text="${#numbers.formatDecimal(service.price, 0, 'COMMA', 0, 'POINT')} + '원'">가격</p>
                    <a th:href="@{'/service/' + ${service.id}}" class="btn btn-outline-secondary">상세보기</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
