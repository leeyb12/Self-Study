spring.application.name=note

# ===================== Server =====================
server.port=${PORT:8080}
 
# ===================== Datasource (MariaDB) =====================
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/notes_app?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul}
spring.datasource.username=${DB_USERNAME:note}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=${DB_DRIVER:org.mariadb.jdbc.Driver}
 
# ===================== JPA / Hibernate =====================
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
 
# ===================== Connection Pool (HikariCP) =====================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
 
# ===================== JWT (인증용, 직접 구현 시) =====================
# HS256 서명용 키. 운영 환경에서는 환경변수(JWT_SECRET)로 주입하세요. 최소 32바이트 이상.
jwt.secret=${JWT_SECRET:change-this-to-a-very-long-random-secret-key-at-least-32-bytes}
jwt.expiration-ms=86400000

# ===================== CORS (프론트엔드 개발 서버) =====================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ===================== 파일 업로드 =====================
# 첨부파일 저장 디렉터리 (절대/상대 경로 모두 가능). 없으면 자동 생성.
app.upload.dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# ===================== Ollama (로컬 LLM) =====================
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:gemma4:e2b}
# LLM 응답 대기 타임아웃(초)
ollama.timeout-seconds=300
# 요약에 사용할 최대 입력 문자 수 (너무 길면 잘라서 전달)
ollama.max-input-chars=12000

# ===================== Logging =====================
logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.pknu26.note=DEBUG
