spring.application.name=music

server.port=${PORT:8080}

spring.output.ansi.enabled=always

spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521:xe}
spring.datasource.username=${DB_USERNAME:music_project}
spring.datasource.password=${DB_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:Qm9yblRvQmVQcm9kdWN0aW9uU2VjdXJlS2V5MTIzNDU2Nzg5}

app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:*}
app.music.storage-dir=${MUSIC_STORAGE_DIR:./music_storage}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
