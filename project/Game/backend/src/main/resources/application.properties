spring.application.name=game

# ---- MariaDB ----
# 아래 기본값은 로컬 개발용. 필요 시 환경변수(DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD)로 덮어쓴다.
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:gamedb}
spring.datasource.username=game
spring.datasource.password=1234
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- 로컬 LLM (Ollama) ----
# Ollama가 로컬에서 실행 중이어야 하며, 모델은 미리 pull 되어 있어야 한다.
# 모델 태그가 다르면 OLLAMA_MODEL 환경변수로 덮어쓴다. (예: ollama list 로 확인)
ollama.base-url=${OLLAMA_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:gemma4:e2b}

server.port=8080
