    <h3>튤립</h3>
    <p>
      소아시아(터키) 원산으로 원예용으로 재배하는 여러해살이풀이다.
      비늘줄기는 난형, 원줄기는 원기둥 모양으로 곧게 서며, 가지는 갈라지지 않는다.
    </p>
    <p>햇볕이 잘 들고 배수가 잘되는 토양에 심는 것이 적합하며 화분은 구근의 2~3배 정도 크기가 적당하다.</p>
