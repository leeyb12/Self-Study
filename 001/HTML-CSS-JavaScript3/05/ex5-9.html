<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      p {
        line-height: 200%;
        padding: 30px;
        border: solid 2px pink;
        border-radius: 20px;
      }
    </style>
  </head>
  <body>
    <p>웹 페이지에 있는 모든 HTML 요소는 사각형 형태를 가지는 박스로 생각할 수 있다.
        CSS에서는 이러한 박스를 기반으로 하여 요소에 경계선을 그릴 수 있다.
    </p>
  </body>
</html>
