<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      * {
        margin: 0;  /* 마진 초기화 */
      }
      div {
        width: 300px;  /* 너비 */
        border: solid 2px #aaaaaa;  /* 경계선 */
        padding: 30px;  /* 패딩 */
        border-radius: 15px;  /* 박스 모서리 */
        margin: 20px 0 0 20px;  /* 마진 */
      }
      h3 {
        border-bottom: solid 1px #cccccc;  /* 하단 경계선 */
        padding-bottom: 8px;  /* 하단 패딩 */
      }
      p {
        line-height: 180%;  /* 줄 간격 */
        border-bottom: dotted 1px #cccccc;  /* 하단 점선 경계선 */
        padding: 10px 0;  /* 패딩 */
      }
      h4 {
        text-align: right;  /* 우측 정렬 */
        font-weight: normal;  /* 글자 기본 굵기 */
        margin-top: 10px;  /* 상단 마진 */
      }
      a:hover {
        color: orange;  /* 마우스 포인터를 올렸을 때 */
      }
    </style>
  </head>
  <body>
    <div>
      <h3>HTML/CSS 강좌</h3>
      <p>HTML/CSS을 이용하면 텍스트, 이미지, 비디오, 오디오 등으로 웹 페이지를 제작할 수 있습니다.</p>
      <h4><a href="#">바로가기 &gt;&gt;</a></h4>
    </div>
  </body>
</html>
