<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      h2 {
        color: red;
      }
      span {
        font-weight: bold;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h2>록 음악</h2>
    <p>
      록 음악은 <span>1950년대 초</span> 미국에서 생겨난 대중음악의 한 형식이다.
      록은 일반적으로 보컬, 리드 전기 기타, 베이스 기타, 드럼의 넷으로 구성되며,
      <span>강렬한 기타 혹은 드럼 소리</span>가 특징이다.
    </p>
  </body>
</html>
