<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      a:link {
        color: grey;
        text-decoration: none;
      }
      a:visited {
        color: grey;
        text-decoration: none;
      }
      a:hover {
        color: red;
        text-decoration: underline;
        font-weight: bold;
      }
      a:active {
        color: grey;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <h3>강아지 품종</h3>
    <ul>
      <li><a href="#">진돗개</a></li>
      <li><a href="#">푸들</a></li>
      <li><a href="#">몰티즈</a></li>
      <li><a href="#">닥스훈트</a></li>
    </ul>
  </body>
</html>
