  <body>
    <h3>프론토사</h3>
    <img src="frontosa.png" width="400">
    <p>
      키포틸라피아 프론토사(Cyphotilapia frontosa)는 탕가니카호의 고유종 시클리드이다.
      한국을 비롯한 서구권에는 관상어로 수입하는 어류이다. 프론토사로 불린다.
      크기는 40cm이고 수심 30~50의 저면에 살며 알과 치어를 입 속에 넣어 보호하는 마우스브리더이다.
    </p>
  </body>
