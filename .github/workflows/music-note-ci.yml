name: Music and Note CI

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'project/Music/**'
      - 'project/Note/**'
      - '.github/workflows/music-note-ci.yml'
  pull_request:
    paths:
      - 'project/Music/**'
      - 'project/Note/**'
      - '.github/workflows/music-note-ci.yml'
  workflow_dispatch:

jobs:
  music-backend:
    name: Music Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/Music/Backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew assemble --no-daemon

  music-frontend:
    name: Music Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/Music/Frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: project/Music/Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  note-backend:
    name: Note Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/Note/Backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew assemble --no-daemon

  note-frontend:
    name: Note Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/Note/Frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: project/Note/Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
