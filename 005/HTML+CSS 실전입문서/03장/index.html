<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }
      * {
        box-sizing: border-box;
      }

      .bg-img {
        background-image: url("https://cdn.pixabay.com/photo/2020/09/19/19/37/landscape-5585247_960_720.jpg");
        min-height: 380px;
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        position: relative;
      }

      .container { 
        position: absolute;
        margin: 20px;
        width: auto;
      }

      .topnav {
        overflow: hidden;
        background-color: #273261;
      }

      .topnav a {
        float: left;
        color: #f2f2f2;
        text-align: center;
        padding: 14px 16px;
        text-decoration: none;
        font-size: 17px;
      }

      .topnav a:hover {
        background-color: #ddd;
        color: rgb(224, 24, 24);
      }
    </style>
  </head>
  <body>
    <h2>이미지위 메뉴</h2>
    <div class="bg-img">
      <div class="container">
        <div class="topnav">
          <a href="#">홈페이지</a>
          <a href="#">뉴스피드</a>
          <a href="#">고객센터</a>
          <a href="#">이메일문의</a>
        </div>
      </div>
    </div>
  </body>
</html>
